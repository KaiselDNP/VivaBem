databases:
  - name: vivabem-db
    databaseName: vivabem
    user: vivabem_app
    plan: free

services:
  - type: web
    name: vivabem-kaiseldnp
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /status/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: vivabem-db
          property: connectionString
      - key: VIVABEM_DJANGO_SECRET_KEY
        generateValue: true
      - key: VIVABEM_DEBUG
        value: "false"
      - key: VIVABEM_SECURE_SSL_REDIRECT
        value: "true"
      - key: VIVABEM_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: VIVABEM_BEHIND_HTTPS_PROXY
        value: "true"
      - key: VIVABEM_ADMIN_EMAIL
        sync: false
      - key: VIVABEM_ADMIN_PASSWORD
        sync: false
