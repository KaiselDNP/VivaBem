{% load static %}
<!doctype html>
<html lang="pt-BR" data-user-role="{% if user.is_authenticated %}{{ user.role }}{% else %}anonymous{% endif %}" data-default-font-size="{% if user.is_authenticated and user.role == 'senior' %}large{% else %}medium{% endif %}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="VivaBem conecta pessoas idosas, familiares e profissionais de apoio em Avaré-SP.">
    <title>{% block title %}VivaBem{% endblock %}</title>
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/accessibility.js' %}?v=20260824-9"></script>
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=20260831-12">
</head>
<body>
    {% if not user.is_authenticated %}{% include "includes/reading_welcome.html" %}{% endif %}
    <a class="skip-link" href="#conteudo">Ir para o conteúdo principal</a>
    {% include "includes/accessibility_tools.html" %}
    {% block body %}{% endblock %}
</body>
</html>
