<aside class="accessibility-tools" aria-label="Ferramentas de acessibilidade">
    <div class="container accessibility-tools-inner">
        <strong class="accessibility-title">Leitura e texto</strong>
        <div class="accessibility-actions">
            <div class="font-size-control">
                <label for="font-size-select">Tamanho da letra</label>
                <select id="font-size-select" data-font-size-select>
                    <option value="small">Pequena</option>
                    <option value="medium">Média</option>
                    <option value="large">Grande</option>
                    <option value="xlarge">Super grande</option>
                </select>
            </div>
            <button class="read-aloud-button" type="button" data-read-aloud aria-pressed="false" aria-keyshortcuts="F2" aria-label="Ouvir um item da página. Atalho F2">
                <span aria-hidden="true">🔊</span>
                <span class="read-button-label" data-read-button-label>Ouvir um item</span>
                <kbd class="shortcut-hint" aria-hidden="true">F2</kbd>
            </button>
            <a class="accessibility-help-link" href="{% url 'core:help' %}">Preciso de ajuda</a>
        </div>
        <span class="visually-hidden" data-accessibility-status aria-live="polite"></span>
    </div>
</aside>
<div class="read-selection-prompt" data-read-selection-prompt role="status" hidden>
    <span aria-hidden="true">🔊</span>
    <span>Toque no texto ou botão que quer ouvir. Este toque apenas fará a leitura.</span>
</div>
