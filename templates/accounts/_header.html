<header class="auth-header">
    <div class="container header-inner">
        <a class="brand" href="{% url 'core:home' %}" aria-label="VivaBem, página inicial">
            <span class="brand-mark" aria-hidden="true">V</span>
            <span>VivaBem</span>
        </a>
        <div class="account-actions">
            {% include "includes/theme_toggle.html" %}
            {% if user.is_authenticated %}
                <a class="header-login" href="{% url 'accounts:dashboard' %}">Meu painel</a>
            {% else %}
                <a class="header-login" href="{% url 'accounts:login' %}">Entrar</a>
            {% endif %}
        </div>
    </div>
</header>
