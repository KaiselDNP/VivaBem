{% extends "base.html" %}

{% block title %}Senha atualizada — VivaBem{% endblock %}

{% block body %}
{% include "accounts/_header.html" %}
<main id="conteudo" class="auth-page auth-status-page">
    <section class="container form-card auth-status-card" aria-labelledby="reset-complete-title">
        <span class="eyebrow">Acesso recuperado</span>
        <h1 id="reset-complete-title" class="form-page-title">Sua senha foi atualizada</h1>

        <a class="button button-primary" href="{% url 'accounts:login' %}">Entrar no VivaBem</a>
    </section>
</main>
{% endblock %}
